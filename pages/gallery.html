<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="../styles/gallery.css" />
    <script
      src="https://kit.fontawesome.com/01ed1881ad.js"
      crossorigin="anonymous"
    ></script>
    <script src="../scripts/burger.js" defer></script>
    <script src="../scripts/gallery.js" defer></script>

    <title>Dexter - Gallery</title>
  </head>
  <body>
    <div id="wrapper">
      <!-- HEADER -->
      <header>
        <div id="burger_button">
          <i class="fa-solid fa-bars"></i>
        </div>
        <nav id="nav_links">
          <div id="site_links">
            <a href="../index.html">HOME</a>
            <a class="active" href="./gallery.html">GALLERY</a>
            <a href="./synopsis.html">SYNOPSIS</a>
            <a href="./cast.html">CAST</a>
          </div>
          <div id="SoMe_links">
            <a
              href="https://x.com/theagency_sho"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Dexter on X"
            >
              <i class="fa-brands fa-x-twitter"></i>
            </a>

            <a
              href="https://www.facebook.com/DexterOnShowtime"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Dexter on Facebook"
            >
              <i class="fa-brands fa-facebook-f"></i>
            </a>

            <a
              href="https://www.instagram.com/sho_dexter/"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Dexter on Instagram"
            >
              <i class="fa-brands fa-instagram"></i>
            </a>

            <a
              href="https://www.youtube.com/@Dexter"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Dexter on YouTube"
            >
              <i class="fa-brands fa-youtube"></i>
            </a>
          </div>
        </nav>
      </header>
      <!-- MAIN -->
      <main>
        <div id="modal">
          <div id="button_container">
            <i class="fa-solid fa-close close_modal_button"></i>
          </div>
          <picture>
            <img
              class="modal_img"
              src="../images/gallery/1.jpg"
              alt="Descritpion"
            />
            <figcaption>Descritpion</figcaption>
          </picture>
        </div>
        <h1>Gallery</h1>
        <div id="gallery">
          <figure class="image_container">
            <picture>
              <source
                media="(max-width: 600px)"
                srcset="../images/gallery/1.jpg"
              />
              <img
                class="thumbnail"
                src="../images/gallery/1_600.jpg"
                alt="Miami Beach, where Dexter’s sunny life hides a much darker secret."
                loading="lazy"
              />
            </picture>
            <figcaption>
              Miami Beach, where Dexter’s sunny life hides a much darker secret.
            </figcaption>
          </figure>

          <figure class="image_container">
            <picture>
              <source
                media="(max-width: 600px)"
                srcset="../images/gallery/2.jpg"
              />
              <img
                class="thumbnail"
                src="../images/gallery/2_600.jpg"
                alt="Dexter preparing his kill room with plastic sheeting."
                loading="lazy"
              />
            </picture>
            <figcaption>
              Dexter preparing his kill room with plastic sheeting.
            </figcaption>
          </figure>

          <figure class="image_container">
            <picture>
              <source
                media="(max-width: 600px)"
                srcset="../images/gallery/3.jpg"
              />
              <img
                class="thumbnail"
                src="../images/gallery/3_600.jpg"
                alt="Dexter admiring his collection of blood slides."
                loading="lazy"
              />
            </picture>
            <figcaption>
              Dexter admiring his collection of blood slides.
            </figcaption>
          </figure>

          <figure class="image_container">
            <picture>
              <source
                media="(max-width: 600px)"
                srcset="../images/gallery/4.jpg"
              />
              <img
                class="thumbnail"
                src="../images/gallery/4_600.jpg"
                alt="Miami at night, where Dexter’s dark side comes alive."
                loading="lazy"
              />
            </picture>
            <figcaption>
              Miami at night, where Dexter’s dark side comes alive.
            </figcaption>
          </figure>

          <figure class="image_container">
            <picture>
              <source
                media="(max-width: 600px)"
                srcset="../images/gallery/5.jpg"
              />
              <img
                class="thumbnail"
                src="../images/gallery/5_600.jpg"
                alt="Dexter holding the plastic wrap, almost ready."
                loading="lazy"
              />
            </picture>
            <figcaption>
              Dexter holding the plastic wrap, almost ready.
            </figcaption>
          </figure>

          <figure class="image_container">
            <picture>
              <source
                media="(max-width: 600px)"
                srcset="../images/gallery/6.jpg"
              />
              <img
                class="thumbnail"
                src="../images/gallery/6_600.jpg"
                alt="Miami Metro Police headquarters, where Dexter works by day."
                loading="lazy"
              />
            </picture>
            <figcaption>
              Miami Metro Police headquarters, where Dexter works by day.
            </figcaption>
          </figure>

          <figure class="image_container">
            <picture>
              <source
                media="(max-width: 600px)"
                srcset="../images/gallery/7.jpg"
              />
              <img
                class="thumbnail"
                src="../images/gallery/7_600.jpg"
                alt="The view from Dexter’s desk at Miami Metro."
                loading="lazy"
              />
            </picture>
            <figcaption>The view from Dexter’s desk at Miami Metro.</figcaption>
          </figure>

          <figure class="image_container">
            <picture>
              <source
                media="(max-width: 600px)"
                srcset="../images/gallery/8.jpg"
              />
              <img
                class="thumbnail"
                src="../images/gallery/8_600.jpg"
                alt="The view from the Miami Metro lab, where Dexter analyzes blood evidence."
                loading="lazy"
              />
            </picture>
            <figcaption>
              The view from the Miami Metro lab, where Dexter analyzes blood
              evidence.
            </figcaption>
          </figure>

          <figure class="image_container">
            <picture>
              <source
                media="(max-width: 600px)"
                srcset="../images/gallery/9.jpg"
              />
              <img
                class="thumbnail"
                src="../images/gallery/9_600.jpg"
                alt="Dexter's boat Slice of Life moored at a marina dock"
                loading="lazy"
              />
            </picture>
            <figcaption>
              Dexter's boat Slice of Life moored at a marina dock
            </figcaption>
          </figure>
        </div>
      </main>
      <!-- FOOTER -->
      <footer>
        <img alt="Paramount" src="../images/footer/paramount.svg" />
        <img alt="SkyShowtime" src="../images/footer/skyshowtime.svg" />
        <img alt="Dexter Logo" src="../images/footer/dexter_logo2.svg" />
      </footer>
    </div>
  </body>
</html>
