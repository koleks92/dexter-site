<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="../styles/gallery.css" />
    <script
      src="https://kit.fontawesome.com/01ed1881ad.js"
      crossorigin="anonymous"
    ></script>
    <script src="../scripts/burger.js" defer></script>
    <title>Dexter - Gallery</title>
  </head>
  <body>
    <div id="wrapper">
      <!-- HEADER -->
      <header>
        <div id="burger_button">
          <i class="fa-solid fa-bars"></i>
        </div>
        <nav id="nav_links">
          <div id="site_links">
            <a href="../index.html">HOME</a>
            <a class="active" href="./gallery.html">GALLERY</a>
            <a href="./synopsis.html">SYNOPSIS</a>
            <a href="./cast.html">CAST</a>
          </div>
          <div id="SoMe_links">
            <a
              href="https://x.com/theagency_sho"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Dexter on X"
            >
              <i class="fa-brands fa-x-twitter"></i>
            </a>

            <a
              href="https://www.facebook.com/DexterOnShowtime"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Dexter on Facebook"
            >
              <i class="fa-brands fa-facebook-f"></i>
            </a>

            <a
              href="https://www.instagram.com/sho_dexter/"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Dexter on Instagram"
            >
              <i class="fa-brands fa-instagram"></i>
            </a>

            <a
              href="https://www.youtube.com/@Dexter"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Dexter on YouTube"
            >
              <i class="fa-brands fa-youtube"></i>
            </a>
          </div>
        </nav>
      </header>
      <!-- MAIN -->
      <main>
        <h1>Gallery</h1>
        <div id="gallery">
          <figure class="image_container">
            <picture>
              <source
                media="(max-width: 600px)"
                srcset="../images/gallery/1.jpg"
              />
              <img
                src="../images/gallery/1_600.jpg"
                alt="Dexter Morgan examining blood spatter evidence with a magnifying tool"
                loading="lazy"
              />
            </picture>
            <figcaption>
              Dexter Morgan analyzing a blood spatter pattern at a crime scene.
            </figcaption>
          </figure>

          <figure class="image_container">
            <picture>
              <source
                media="(max-width: 600px)"
                srcset="../images/gallery/2.jpg"
              />
              <img
                src="../images/gallery/2_600.jpg"
                alt="Dexter lining a room floor to ceiling with plastic sheeting"
                loading="lazy"
              />
            </picture>
            <figcaption>
              Dexter preparing his kill room with plastic sheeting.
            </figcaption>
          </figure>

          <figure class="image_container">
            <picture>
              <source
                media="(max-width: 600px)"
                srcset="../images/gallery/3.jpg"
              />
              <img
                src="../images/gallery/3_600.jpg"
                alt="Dexter and Debra Morgan standing together inside Miami Metro Police headquarters"
                loading="lazy"
              />
            </picture>
            <figcaption>
              Dexter and Debra Morgan at the Miami Metro Police Department.
            </figcaption>
          </figure>

          <figure class="image_container">
            <picture>
              <source
                media="(max-width: 600px)"
                srcset="../images/gallery/4.jpg"
              />
              <img
                src="../images/gallery/4_600.jpg"
                alt="Close-up of Dexter's collection of blood slides in wooden storage boxes"
                loading="lazy"
              />
            </picture>
            <figcaption>
              A close-up of Dexter's signature glass slide collection.
            </figcaption>
          </figure>

          <figure class="image_container">
            <picture>
              <source
                media="(max-width: 600px)"
                srcset="../images/gallery/5.jpg"
              />
              <img
                src="../images/gallery/5_600.jpg"
                alt="Dexter in a lab coat working at a forensics lab bench"
                loading="lazy"
              />
            </picture>
            <figcaption>
              Dexter working undercover as a forensic technician.
            </figcaption>
          </figure>

          <figure class="image_container">
            <picture>
              <source
                media="(max-width: 600px)"
                srcset="../images/gallery/6.jpg"
              />
              <img
                src="../images/gallery/6_600.jpg"
                alt="Dexter facing off against one of his targets in a dimly lit room"
                loading="lazy"
              />
            </picture>
            <figcaption>
              A tense standoff between Dexter and one of his targets.
            </figcaption>
          </figure>

          <figure class="image_container">
            <picture>
              <source
                media="(max-width: 600px)"
                srcset="../images/gallery/7.jpg"
              />
              <img
                src="../images/gallery/7_600.jpg"
                alt="Dexter sitting alone at night, lost in thought about his father's code"
                loading="lazy"
              />
            </picture>
            <figcaption>
              Dexter reflecting on his father's code late at night.
            </figcaption>
          </figure>

          <figure class="image_container">
            <picture>
              <source
                media="(max-width: 600px)"
                srcset="../images/gallery/8.jpg"
              />
              <img
                src="../images/gallery/8_600.jpg"
                alt="Miami city skyline silhouetted against an orange dusk sky"
                loading="lazy"
              />
            </picture>
            <figcaption>
              Miami's skyline at dusk, a recurring backdrop in the series.
            </figcaption>
          </figure>

          <figure class="image_container">
            <picture>
              <source
                media="(max-width: 600px)"
                srcset="../images/gallery/9.jpg"
              />
              <img
                src="../images/gallery/9_600.jpg"
                alt="Dexter's boat Slice of Life moored at a marina dock"
                loading="lazy"
              />
            </picture>
            <figcaption>
              Dexter's boat, the "Slice of Life," docked at the marina.
            </figcaption>
          </figure>
        </div>
      </main>
      <!-- FOOTER -->
      <footer>
        <img alt="Paramount" src="../images/footer/paramount.svg" />
        <img alt="SkyShowtime" src="../images/footer/skyshowtime.svg" />
        <img alt="Dexter Logo" src="../images/footer/dexter_logo2.svg" />
      </footer>
    </div>
  </body>
</html>
